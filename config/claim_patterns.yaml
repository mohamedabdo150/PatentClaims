# Claim boundary pattern profiles.
#
# IMPORTANT: none of these profiles has been verified against real patent
# documents yet ("verified: false"). Run scripts/analyze_docx.py on
# representative files and tune/verify a profile before production use.
#
# Matching is performed on the *logical* (stored) text of each top-level
# paragraph of the main document body. When include_numbering_label is true,
# the label generated by Word list numbering (e.g. "1." from w:numPr) is
# prepended to the paragraph text before matching.
#
# claim_start_pattern MUST contain a named group "number".
# claim_end_pattern: null  => a claim ends at the next claim start or at the
#                             claims-section end / end of document ("next_start" mode).
# claim_end_pattern: regex => explicit end marker; the matching paragraph is
#                             part of the claim ("explicit_end" mode).

profiles:
  example:
    verified: false
    description: >
      Generic example patterns for "<number>. text" claims after a claims heading.
      NOT production patterns.
    english:
      section_start_pattern: '^\s*(?:CLAIMS|What\s+is\s+claimed\s+is|We\s+claim|I\s+claim|The\s+invention\s+claimed\s+is)\s*:?\s*$'
      section_end_pattern: '^\s*(?:ABSTRACT|Abstract\s+of\s+the\s+Disclosure)\b'
      claim_start_pattern: '^\s*(?P<number>\d{1,4})\s*[.)\-–]\s*\S'
      claim_end_pattern: null
      case_sensitive: false
      match_mode: match
      include_numbering_label: true
      ignore_bidi_marks_for_matching: true
      max_match_chars: 2000
    arabic:
      section_start_pattern: '^\s*(?:عناصر\s+الحماية|عناصر\s+الحمايه|الادعاءات|المطالب)\s*:?\s*$'
      section_end_pattern: '^\s*(?:الملخص|ملخص\s+الاختراع)\b'
      claim_start_pattern: '^\s*(?P<number>[0-9٠-٩۰-۹]{1,4})\s*[.)\-–ـ٫]\s*\S'
      claim_end_pattern: null
      case_sensitive: false
      match_mode: match
      include_numbering_label: true
      ignore_bidi_marks_for_matching: true
      max_match_chars: 2000
    validation:
      require_section_start: true
      require_start_marker: true
      require_end_marker: false
      reject_duplicate_claim_numbers: true
      reject_unclosed_claims: true
      reject_orphan_content: true
      require_sequential_numbers: false

  synthetic-test:
    verified: false
    description: Patterns matching the synthetic test fixtures in tests/fixtures (explicit end markers).
    english:
      section_start_pattern: '^\s*CLAIMS\s*$'
      section_end_pattern: '^\s*END\s+OF\s+CLAIMS\s*$'
      claim_start_pattern: '^\s*(?P<number>\d{1,4})\s*\.\s+\S'
      claim_end_pattern: '[.;]\s*$'
      case_sensitive: true
      match_mode: match
      include_numbering_label: true
      ignore_bidi_marks_for_matching: true
      max_match_chars: 2000
    arabic:
      section_start_pattern: '^\s*عناصر\s+الحماية\s*$'
      section_end_pattern: '^\s*نهاية\s+عناصر\s+الحماية\s*$'
      claim_start_pattern: '^\s*(?P<number>[0-9٠-٩]{1,4})\s*[.\-]\s+\S'
      claim_end_pattern: '[.؛;]\s*$'
      case_sensitive: true
      match_mode: match
      include_numbering_label: true
      ignore_bidi_marks_for_matching: true
      max_match_chars: 2000
    validation:
      require_section_start: true
      require_start_marker: true
      require_end_marker: true
      reject_duplicate_claim_numbers: true
      reject_unclosed_claims: true
      reject_orphan_content: true
      require_sequential_numbers: false
